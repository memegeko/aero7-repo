name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq sudo

      - name: Bash syntax
        run: bash -n scripts/*.sh tests/*.sh

      - name: Delta entry points are executable
        run: |
          test -x scripts/build-programs-center-delta.sh
          test -x scripts/publish-programs-center-delta.sh
          test -x site/activate-aero7-programs-center-delta

      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh ops/builder-prune/install.sh

      - name: Builder retention safeguards
        run: tests/test-prune-builder.sh

      - name: Guarded builder cleanup access
        run: |
          bash -n ops/builder-prune/install.sh
          python3 tests/test-builder-prune-access.py

      - name: Python validation
        run: |
          python3 -m py_compile scripts/dependency-order.py tests/test-release-gates.py tests/validate-repo.py
          python3 scripts/dependency-order.py --write
          python3 tests/test-release-gates.py
          python3 tests/test-programs-center-delta-filename.py
          python3 tests/test-programs-center-delta-metadata.py
          python3 tests/validate-repo.py

      - name: JSON validity
        run: jq empty manifests/*.json
