name: build-packages

on:
  workflow_dispatch:
    inputs:
      resume_build_id:
        description: Existing staging ID, PROGRAMS-CENTER-DELTA, or PROGRAMS-CENTER-DELTA-PUBLISH:BUILD_ID
        required: false
        default: ""
        type: string
      final_release_confirmation:
        description: Leave blank for testing; enter PUBLISH-AERO7-FINAL only for the approved final release
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aero7-package-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, arch, aero7-builder]
    timeout-minutes: 360
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Keep the Programs Center candidate private
        env:
          RESUME_BUILD_ID: ${{ inputs.resume_build_id }}
          FINAL_RELEASE_CONFIRMATION: ${{ inputs.final_release_confirmation }}
        run: |
          if [[ "$GITHUB_REF_NAME" == programs-center-0.2.0-candidate ]]; then
            if [[ "$RESUME_BUILD_ID" == PROGRAMS-CENTER-DELTA && -z "$FINAL_RELEASE_CONFIRMATION" ]]; then
              :
            elif [[ "$RESUME_BUILD_ID" =~ ^PROGRAMS-CENTER-DELTA-PUBLISH:[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ &&
                    "$FINAL_RELEASE_CONFIRMATION" == PUBLISH-AERO7-FINAL ]]; then
              :
            else
              printf 'This candidate branch accepts only a private delta build or its separately confirmed publication.\n' >&2
              exit 1
            fi
          fi

      - name: Verify pinned package metadata
        run: scripts/verify-sources.sh

      - name: Build complete package set
        if: inputs.resume_build_id == ''
        run: scripts/build-all.sh

      - name: Build private Programs Center delta
        if: inputs.resume_build_id == 'PROGRAMS-CENTER-DELTA' && inputs.final_release_confirmation == ''
        env:
          AERO7_SIGNING_FINGERPRINT: 72C79ABBBBE96446DD3324042694BFE1090F4FD6
        run: |
          [[ "$GITHUB_REF_NAME" == programs-center-0.2.0-candidate ]]
          scripts/build-programs-center-delta.sh \
            20261022T202916Z-50dfda1fb6fb \
            9974edd62cfff70035d75791b60920992cf7cd060e096d2ee62a87ddefb44ba2

      - name: Finalize existing staged package set
        if: inputs.resume_build_id != '' && inputs.resume_build_id != 'PROGRAMS-CENTER-DELTA' && !startsWith(inputs.resume_build_id, 'PROGRAMS-CENTER-DELTA-PUBLISH:')
        env:
          RESUME_BUILD_ID: ${{ inputs.resume_build_id }}
        run: |
          [[ "$RESUME_BUILD_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]
          scripts/finalize-build.sh "$RESUME_BUILD_ID"
          printf '%s\n' "$RESUME_BUILD_ID" > /srv/aero7-builder/current-build-id
          scripts/prune-builder.sh \
            --current-build-id "$RESUME_BUILD_ID" \
            --remove-current-sources

      - name: Capture validated staging build
        id: staged
        env:
          RESUME_BUILD_ID: ${{ inputs.resume_build_id }}
        run: |
          if [[ "$RESUME_BUILD_ID" == PROGRAMS-CENTER-DELTA-PUBLISH:* ]]; then
            build_id="${RESUME_BUILD_ID#PROGRAMS-CENTER-DELTA-PUBLISH:}"
          else
            build_id="$(cat /srv/aero7-builder/current-build-id)"
          fi
          [[ "$build_id" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]
          test -f "/srv/aero7-builder/staging/$build_id/build-manifest.json"
          printf 'build_id=%s\n' "$build_id" >>"$GITHUB_OUTPUT"

      - name: Prepare final repository artifact
        if: inputs.final_release_confirmation == 'PUBLISH-AERO7-FINAL'
        env:
          RESUME_BUILD_ID: ${{ inputs.resume_build_id }}
        run: |
          if [[ "$RESUME_BUILD_ID" == PROGRAMS-CENTER-DELTA-PUBLISH:* ]]; then
            build_id="${{ steps.staged.outputs.build_id }}"
            scripts/publish-programs-center-delta.sh \
              "$build_id" "/srv/aero7-builder/staging/$build_id/base" \
              20261022T202916Z-50dfda1fb6fb \
              9974edd62cfff70035d75791b60920992cf7cd060e096d2ee62a87ddefb44ba2 \
              PUBLISH-AERO7-FINAL
          else
            scripts/promote-build.sh "${{ steps.staged.outputs.build_id }}"
          fi

      - name: Upload staging report
        uses: actions/upload-artifact@v4
        with:
          name: aero7-build-report
          path: /srv/aero7-builder/staging/${{ steps.staged.outputs.build_id }}/build-manifest.json
          if-no-files-found: error

      - name: Upload final repository artifact
        if: inputs.final_release_confirmation == 'PUBLISH-AERO7-FINAL' && !startsWith(inputs.resume_build_id, 'PROGRAMS-CENTER-DELTA-PUBLISH:')
        uses: actions/upload-artifact@v4
        with:
          name: aero7-pacman-repository
          path: public/
          if-no-files-found: error
