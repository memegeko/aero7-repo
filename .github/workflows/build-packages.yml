name: build-packages

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the build into public/ after validation
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      resume_build_id:
        description: Existing complete staging build to sign and publish without recompiling
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aero7-package-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, arch, aero7-builder]
    timeout-minutes: 360
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify pinned package metadata
        run: scripts/verify-sources.sh

      - name: Build complete package set
        if: inputs.resume_build_id == ''
        run: scripts/build-all.sh

      - name: Finalize existing staged package set
        if: inputs.resume_build_id != ''
        env:
          RESUME_BUILD_ID: ${{ inputs.resume_build_id }}
        run: |
          [[ "$RESUME_BUILD_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]
          scripts/finalize-build.sh "$RESUME_BUILD_ID"
          printf '%s\n' "$RESUME_BUILD_ID" > /srv/aero7-builder/current-build-id
          scripts/prune-builder.sh \
            --current-build-id "$RESUME_BUILD_ID" \
            --remove-current-sources

      - name: Prepare repository artifact
        run: |
          build_id="$(cat /srv/aero7-builder/current-build-id)"
          scripts/promote-build.sh "$build_id"

      - name: Upload staging report
        uses: actions/upload-artifact@v4
        with:
          name: aero7-build-report
          path: /srv/aero7-builder/staging/*/build-manifest.json
          if-no-files-found: error

      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: aero7-pacman-repository
          path: public/
          if-no-files-found: error
