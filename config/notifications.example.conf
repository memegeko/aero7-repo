# Copy this file to ~/.config/aero7-builder/notifications.conf and set mode 600.
# Never commit the real values.

AERO7_DISCORD_UPDATES_WEBHOOK=
AERO7_DISCORD_BUILDER_FAILURES_WEBHOOK=
AERO7_DISCORD_REPOSITORY_PUBLISHED_WEBHOOK=

# Optional public release announcements. The token must be authorized to write
# only to AERO7_NTFY_TOPIC; subscribers should have read-only access.
AERO7_NTFY_BASE_URL=https://notify.aero7.org
AERO7_NTFY_TOPIC=aero7-updates
AERO7_NTFY_TOKEN=
